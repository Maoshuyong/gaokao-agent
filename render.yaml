services:
  - type: web
    name: gaokao-agent
    runtime: python
    plan: free
    repo: https://github.com/Maoshuyong/gaokao-agent
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: API_KEY
        sync: false
      - key: SILICONFLOW_KEY
        sync: false
